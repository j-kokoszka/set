name: Backend CI

on:
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**', 'tests/**' ]

jobs:
  qa:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Deps
        run: |
          uv venv --allow-existing
          uv pip install -r backend/requirements.txt
          uv pip install pytest httpx pytest-mock moto
      - name: Run Backend Tests
        run: DYNAMODB_PORT=8000 make test-backend
