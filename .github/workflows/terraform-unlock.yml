name: Terraform State Unlock

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  unlock:
    name: Force Unlock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      
      - name: Clear DynamoDB Locks
        run: |
          echo "::warning:: This is a forceful operation that will clear ALL active Terraform locks in DynamoDB."
          
          # Identify the DynamoDB lock table name from backend.tf
          TABLE_NAME=$(grep 'dynamodb_table' infra/backend.tf | awk -F'"' '{print $2}')
          echo "Target DynamoDB table: $TABLE_NAME"
          
          if [ -z "$TABLE_NAME" ]; then
            echo "Error: Could not identify DynamoDB table name from infra/backend.tf"
            exit 1
          fi

          # Get all LockIDs from the table
          LOCK_IDS=$(aws dynamodb scan --table-name "$TABLE_NAME" --projection-expression "LockID" --query "Items[].LockID.S" --output text)
          
          if [ -z "$LOCK_IDS" ] || [ "$LOCK_IDS" == "None" ]; then
            echo "No active locks found in $TABLE_NAME."
          else
            echo "Found locks: $LOCK_IDS"
            for lock_id in $LOCK_IDS; do
              echo "Forcefully removing lock: $lock_id"
              aws dynamodb delete-item --table-name "$TABLE_NAME" --key "{\"LockID\": {\"S\": \"$lock_id\"}}"
            done
            echo "Successfully cleared all locks."
          fi
