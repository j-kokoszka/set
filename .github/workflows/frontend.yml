name: Frontend CI

on:
  push:
    branches: [ main ]
    paths: [ 'frontend/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'frontend/**' ]

jobs:
  qa:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Deps
        run: cd frontend && npm ci
      - name: Security Audit (npm audit)
        run: cd frontend && npm audit --audit-level=high
      - name: Static Security Analysis (njsscan)
        uses: ajinabraham/njsscan-action@v0.0.3
        with:
          args: 'frontend/src'
      - name: Lint
        run: make lint-frontend
      - name: Build (Validate)
        run: make build-frontend
      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run E2E Tests
        env:
          VITE_ENABLE_MOCK_LOGIN: 'true'
        run: make test-frontend PLAYWRIGHT_ARGS="--project=chromium"
