name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write # Required for AWS OIDC
  contents: read

jobs:
  quality-assurance:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend QA
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Deps
        run: cd frontend && npm ci
      - name: Lint Frontend
        run: cd frontend && npm run lint
      - name: Build Frontend (Validate)
        run: cd frontend && npm run build

      # Backend QA
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Backend Deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx
      - name: Run Backend Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:backend
          export MOCK_AUTH=true
          pytest tests/

  infrastructure-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    needs: quality-assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
      - name: Tofu Plan
        run: |
          cd infra
          tofu init
          tofu plan -no-color
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6

      # 1. Apply Infrastructure
      - name: Tofu Apply
        run: |
          cd infra
          tofu init
          tofu apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 2. Deploy Backend (Lambda)
      - name: Package & Deploy Lambda
        run: |
          mkdir -p lambda_package
          cp backend/*.py lambda_package/
          grep -vE "boto3|botocore" backend/requirements.txt > temp_reqs.txt
          pip install -r temp_reqs.txt -t lambda_package/
          cd lambda_package
          rm -rf *.dist-info __pycache__ bin
          zip -r ../infra/lambda_function_payload.zip .
          cd ..
          aws lambda update-function-code --function-name set-api --zip-file fileb://infra/lambda_function_payload.zip

      # 3. Deploy Frontend (S3)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Sync S3
        run: |
          S3_BUCKET=$(cd infra && tofu output -raw s3_bucket_name)
          aws s3 sync frontend/dist/ s3://$S3_BUCKET/ --delete
