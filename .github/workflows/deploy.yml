name: Production Deployment

on:
  push:
    branches: [ main ]

permissions:
  id-token: write # Required for AWS OIDC
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.6

      # 1. Apply Infrastructure
      - name: Tofu Apply
        run: |
          cd infra
          tofu init
          tofu apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 2. Deploy Backend (Lambda)
      - name: Package & Deploy Lambda
        run: |
          mkdir -p lambda_package
          cp backend/*.py lambda_package/
          grep -vE "boto3|botocore" backend/requirements.txt > temp_reqs.txt
          pip install -r temp_reqs.txt -t lambda_package/ --platform manylinux2014_x86_64 --implementation cp --python-version 3.11 --only-binary=:all:
          cd lambda_package
          rm -rf *.dist-info __pycache__ bin
          zip -r ../infra/lambda_function_payload.zip .
          cd ..
          aws lambda update-function-code --function-name set-api --zip-file fileb://infra/lambda_function_payload.zip

      # 3. Deploy Frontend (S3)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Sync S3
        run: |
          S3_BUCKET=$(cd infra && tofu output -raw s3_bucket_name)
          # Sync all files with long-term caching (Vite hashes assets)
          aws s3 sync frontend/dist/ s3://$S3_BUCKET/ --delete --cache-control "max-age=31536000, public"
          # Overwrite index.html with no-cache to ensure users always get the latest version
          aws s3 cp frontend/dist/index.html s3://$S3_BUCKET/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(cd infra && tofu output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
