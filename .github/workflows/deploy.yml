name: Production Deployment

on:
  push:
    branches: [ main ]

permissions:
  id-token: write # Required for AWS OIDC
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # 1. Apply Infrastructure
      - name: Tofu Apply
        run: |
          cd infra
          tofu init
          tofu apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_github_pat: ${{ secrets.TF_VAR_GITHUB_PAT }}
          TF_VAR_grafana_cloud_api_key: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          TF_VAR_grafana_cloud_org_slug: ${{ secrets.GRAFANA_CLOUD_ORG_SLUG }}
          TF_VAR_grafana_cloud_stack_slug: ${{ secrets.GRAFANA_CLOUD_STACK_SLUG }}
          TF_VAR_grafana_cloud_region: ${{ secrets.GRAFANA_CLOUD_REGION }}

      # 2. Deploy Backend (Lambda)
      - name: Package & Deploy Lambda
        run: |
          mkdir -p lambda_package
          cp backend/*.py lambda_package/
          grep -vE "boto3|botocore" backend/requirements.txt > temp_reqs.txt
          uv pip install -r temp_reqs.txt -t lambda_package/ --python-platform x86_64-manylinux_2_17 --python-version 3.11 --only-binary :all:
          cd lambda_package
          rm -rf *.dist-info __pycache__ bin
          zip -r ../infra/lambda_function_payload.zip .
          cd ..
          aws lambda update-function-code --function-name set-api --zip-file fileb://infra/lambda_function_payload.zip

      # 3. Deploy Frontend (S3)
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install & Build Frontend
        run: |
          cd infra
          VITE_COGNITO_DOMAIN=$(tofu output -raw cognito_domain)
          VITE_COGNITO_CLIENT_ID=$(tofu output -raw cognito_app_client_id)
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT=$(tofu output -raw grafana_otlp_endpoint)
          VITE_OTEL_TOKEN=$(tofu output -raw grafana_otlp_token)
          
          # Construct OTLP Headers (JSON string for tracing.ts)
          if [ -n "$VITE_OTEL_EXPORTER_OTLP_ENDPOINT" ]; then
            VITE_OTEL_EXPORTER_OTLP_HEADERS="{\"Authorization\":\"Bearer $VITE_OTEL_TOKEN\"}"
          else
            VITE_OTEL_EXPORTER_OTLP_HEADERS=""
          fi

          cd ../frontend
          npm ci
          cd ..
          VITE_COGNITO_DOMAIN=$VITE_COGNITO_DOMAIN \
          VITE_COGNITO_CLIENT_ID=$VITE_COGNITO_CLIENT_ID \
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT=$VITE_OTEL_EXPORTER_OTLP_ENDPOINT \
          VITE_OTEL_EXPORTER_OTLP_HEADERS=$VITE_OTEL_EXPORTER_OTLP_HEADERS \
          make build-frontend
      - name: Sync S3
        run: |
          S3_BUCKET=$(cd infra && tofu output -raw s3_bucket_name)
          # Sync all hashed assets with long-term caching
          aws s3 sync frontend/dist/ s3://$S3_BUCKET/ --delete --exclude "index.html" --exclude "favicon.svg" --cache-control "max-age=31536000, public"
          # Sync non-hashed assets (favicon) with short-term caching
          aws s3 cp frontend/dist/favicon.svg s3://$S3_BUCKET/favicon.svg --cache-control "max-age=3600, public"
          # Overwrite index.html with no-cache
          aws s3 cp frontend/dist/index.html s3://$S3_BUCKET/index.html --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(cd infra && tofu output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
